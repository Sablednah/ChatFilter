org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Plugin properties
plugin_id=chatfilter
# The plugin NAME stays "ChatFilter": it is also the data folder, so a server upgrading from the
# 2.0.0 plugin keeps its plugins/ChatFilter/ and has its old config migrated in place.
plugin_name=ChatFilter
# One above the last Bukkit release (2.0.0, 2014), and the same number as the NeoForge rebuild.
plugin_version=3.0.0
plugin_group_id=com.sablednah.chatfilter
plugin_authors=Sablednah
plugin_description=A chat filter: censors or blocks swearing in chat and in /msg-style commands, sees through disguises, blocks links and spam, with strikes, staff alerts and a silent mode.

## The API the plugin compiles against. A plugin compiled against 1.7.2 runs on every later server.
bukkit_api_floor=1.7.2-R0.3

## The API lines apiCheck re-compiles the plugin sources against, so a method a newer API removed
## shows up as a compile error rather than a NoSuchMethodError on somebody's server.
api_check_versions=1.8.8-R0.1-SNAPSHOT,1.12.2-R0.1-SNAPSHOT,1.13.2-R0.1-SNAPSHOT,1.16.5-R0.1-SNAPSHOT,1.20.4-R0.1-SNAPSHOT,1.21.11-R0.1-SNAPSHOT,26.3-R0.1-SNAPSHOT

name: ${plugin_name}
version: ${plugin_version}
main: ${main_class}
${api_version_line}
author: ${plugin_authors}
description: "${plugin_description}"
website: https://github.com/Sablednah/ChatFilter

commands:
  chatfilter:
    description: ChatFilter commands.
    usage: /<command> [reload|test <text>|add <list> <entry>|remove <list> <entry>|list <list>|strikes <player> [clear]|alerts [on|off|toggle]]
    aliases: [cf]

permissions:
  chatfilter.*:
    description: Everything ChatFilter can do, including not being filtered.
    default: false
    children:
      chatfilter.chat: true
      chatfilter.bypass: true
      chatfilter.see: true
      chatfilter.links: true
      chatfilter.alerts: true
      chatfilter.admin: true
  chatfilter.chat:
    description: May chat at all. Deny it to silence a rank.
    default: true
  chatfilter.bypass:
    description: Not filtered. Not given to ops by default - a filter ops are exempt from is half a filter.
    default: false
  chatfilter.see:
    description: Sees masked words as they were typed.
    default: false
  chatfilter.links:
    description: May post links.
    default: false
  chatfilter.alerts:
    description: Receives staff alerts about caught messages.
    default: op
  chatfilter.admin:
    description: Uses /chatfilter reload, test, add, remove, list and strikes.
    default: op
  # The 2.x names, so an existing permissions setup keeps working. A parent set false hands its
  # children the opposite value, so a negated canchat still silences, as it always did.
  chatfilter.canswear:
    description: Old name for chatfilter.bypass.
    default: false
    children:
      chatfilter.bypass: true
  chatfilter.canchat:
    description: Old name for chatfilter.chat.
    default: true
    children:
      chatfilter.chat: true
  chatfilter.reload:
    description: Old name for chatfilter.admin.
    default: op
    children:
      chatfilter.admin: true
